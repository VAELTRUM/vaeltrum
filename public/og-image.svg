<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#090A0C"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle glow -->
  <circle cx="850" cy="300" r="280" fill="#3B82F6" opacity="0.08" filter="blur(80px)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 140)">
    <rect width="64" height="64" rx="16" fill="#121418" stroke="#27292E" stroke-width="1.5"/>
    <path d="M18 20L32 46L28 46L14 20H18Z" fill="#F7F7F5"/>
    <path d="M46 20L32 46L36 46L50 20H46Z" fill="#C5C8D1"/>
    <path d="M32 24L37 34H27L32 24Z" fill="#3B82F6"/>
  </g>

  <!-- Typography -->
  <text x="184" y="186" fill="#F7F7F5" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="6">VAELTRUM</text>
  <text x="184" y="210" fill="#85868C" font-family="monospace" font-size="12" letter-spacing="3">INDEPENDENT SOFTWARE ENGINEERING</text>

  <text x="100" y="330" fill="#F7F7F5" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="600" letter-spacing="-1.5">
    Engineering Ideas Into Products.
  </text>

  <text x="100" y="400" fill="#85868C" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    SaaS Products • Enterprise Platforms • Custom Digital Solutions
  </text>

  <!-- Bottom boundary -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#27292E" stroke-width="1"/>
  <text x="100" y="555" fill="#62646A" font-family="monospace" font-size="14">https://vaeltrum.com</text>
  <text x="1100" y="555" text-anchor="end" fill="#62646A" font-family="monospace" font-size="14">ARCHITECTURE-FIRST ENGINEERING</text>
</svg>
